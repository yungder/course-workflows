# 可重複使用的 C++ 自動批改 workflow
# 各課程模板 repo 以 uses: yungder/course-workflows/.github/workflows/cpp-grade.yml@main 呼叫
name: C++ 自動批改

on:
  workflow_call:
    inputs:
      std:
        description: C++ 標準
        type: string
        default: "c++17"
      src-glob:
        description: 原始碼位置
        type: string
        default: "src/*.cpp"
      cases-dir:
        description: 測資資料夾（內含 *.in 與同名 *.out）
        type: string
        default: "tests/cases"
      timeout-sec:
        description: 單筆測資執行秒數上限
        type: string
        default: "5"
      warnings-as-info:
        description: true 時編譯警告只提醒不扣分
        type: boolean
        default: true

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 編譯
        id: build
        run: |
          set -o pipefail
          mkdir -p build
          echo '## 編譯結果' >> "$GITHUB_STEP_SUMMARY"
          if g++ -std=${{ inputs.std }} -O2 -Wall -Wextra -o build/main ${{ inputs.src-glob }} 2> build/compile.log; then
            echo '✅ 編譯成功' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '❌ **編譯失敗**' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat build/compile.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -s build/compile.log ]; then
            WARN=$(grep -c 'warning:' build/compile.log || true)
            echo "⚠️ 編譯警告 $WARN 則（請盡量修掉，會列入程式品質評分）" >> "$GITHUB_STEP_SUMMARY"
            echo '<details><summary>展開警告內容</summary>' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat build/compile.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '</details>' >> "$GITHUB_STEP_SUMMARY"
            echo "warnings=$WARN" >> "$GITHUB_OUTPUT"
          else
            echo "warnings=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 執行測資
        id: run
        run: |
          CASES_DIR='${{ inputs.cases-dir }}'
          TIMEOUT='${{ inputs.timeout-sec }}'
          shopt -s nullglob
          INPUTS=("$CASES_DIR"/*.in)
          TOTAL=${#INPUTS[@]}
          if [ "$TOTAL" -eq 0 ]; then
            echo "::warning::$CASES_DIR 內找不到任何 .in 測資，跳過測試"
            echo "passed=0" >> "$GITHUB_OUTPUT"; echo "total=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PASS=0
          {
            echo
            echo '## 測資結果'
            echo
            echo '| 測資 | 結果 | 說明 |'
            echo '|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"

          for IN in "${INPUTS[@]}"; do
            NAME=$(basename "$IN" .in)
            EXP="$CASES_DIR/$NAME.out"
            if [ ! -f "$EXP" ]; then
              echo "| $NAME | ⚠️ | 缺少對應的 $NAME.out |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if timeout "$TIMEOUT" ./build/main < "$IN" > "build/$NAME.actual" 2> "build/$NAME.err"; then
              # 比對時忽略行尾空白與檔尾多餘空行
              if diff -q <(sed -e 's/[[:space:]]*$//' "$EXP" | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba') \
                         <(sed -e 's/[[:space:]]*$//' "build/$NAME.actual" | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba') > /dev/null; then
                PASS=$((PASS+1))
                echo "| $NAME | ✅ 通過 | |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "| $NAME | ❌ 答案錯誤 | 輸出與預期不符 |" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              RC=$?
              if [ "$RC" -eq 124 ]; then
                echo "| $NAME | ⏱️ 逾時 | 超過 ${TIMEOUT}s，可能有無窮迴圈 |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "| $NAME | 💥 執行錯誤 | 結束碼 $RC（可能是陣列越界或除以零）|" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          done

          {
            echo
            echo "**通過 $PASS / $TOTAL 筆測資**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "passed=$PASS" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

          [ "$PASS" -eq "$TOTAL" ]

      - name: 上傳輸出結果供老師檢視
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-output
          path: |
            build/*.actual
            build/*.err
            build/compile.log
          retention-days: 30
          if-no-files-found: ignore
